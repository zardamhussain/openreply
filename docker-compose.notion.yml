services:
  migrate:
    build:
      context: .
      target: worker
    env_file: .env
    command: ["bun", "run", "db:migrate"]
    networks:
      - shared

  web:
    build:
      context: .
      target: web
    env_file: .env
    ports:
      - "${OPENREPLY_HTTP_PORT:-3010}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - shared

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - shared

  cron:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      CRON_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - shared

networks:
  shared:
    external: true
    name: docmost_default
